  # --- Éléments au choix du joueur ---------------------------------------
  # params = [valeur, par_niveau, nombre_d_éléments, 0]  ex. [272, 0, 3, 0]
  # La même valeur est donnée sur `nombre_d_éléments` éléments distincts.
  1068: {stat: random_mastery,    sign: 1, kind: random_elements, count_param: 2,
         fr: "Maîtrise sur N éléments au choix"}
  1069: {stat: random_resistance, sign: 1, kind: random_elements, count_param: 2,
         fr: "Résistance sur N éléments au choix"}

  # --- Caractéristique passée en paramètre (params[4] = id de charac) -------
  # 211 effets « Gain » (charac 120 : 123 items, charac 121 : 88 items) et
  # 2 effets « Perte » (charac 121). Exemples : Casque de puissance [10,0,0,0,120,0],
  # familier Arakne [2,0.16,0,0,121,0]. Le CDN ne donne pas le nom des characs.
  39:   {stat: charac_param, sign: 1,  kind: charac_param, charac_param: 4,
         characs: {120: charac_120, 121: charac_121},
         todo: "À CONFIRMER EN JEU : libellé réel des characs 120 et 121",
         fr: "Gain : charac en paramètre"}
  40:   {stat: charac_param, sign: -1, kind: charac_param, charac_param: 4,
         characs: {120: charac_120, 121: charac_121},
         todo: "À CONFIRMER EN JEU", fr: "Perte : charac en paramètre"}

  # --- Effets non statistiques ------------------------------------------------
  # Applique un état (effets spéciaux d'items : params[0] = id d'état,
  # params[2] = niveau). states.json ne contient que les noms : à modéliser à la main.
  304:  {stat: state, sign: 1, kind: state, fr: "Applique un état"}
  400:  {stat: none, kind: ignore, fr: "Effet vide"}
  999:  {stat: none, kind: ignore, fr: "Technique (niveau des effets enfants)"}
  1020: {stat: none, kind: ignore, fr: "Technique (niveau des effets enfants)"}
  2001: {stat: none, kind: ignore, fr: "% Quantité de récolte (métiers)"}
