# Table actionId -> statistique, pour les effets d'équipement (equipEffects).
#
# Construite à partir de actions.json et items.json, version CDN 1.93.1.62
# (66 actionId distincts utilisés par les équipements). Régénérer le rapport
# après un patch avec :  python -m wakfu_optimizer.data.explore
# Tout actionId utilisé par un équipement mais absent d'ici est signalé.
#
# Valeur d'un effet (vérifié sur les données) :
#   valeur = params[0] + params[1] * niveau
# Pour un équipement normal, params[1] vaut 0 : la valeur est params[0].
# params[1] n'est non nul que pour les familiers/montures (niveau du familier,
# 50 max) et les armes « Makabra » de niveau 0-1 (qui suivent le niveau du
# personnage). Les autres params (ex. [6, 0, 1, 0, 0, 0] pour les PV) ne
# changent pas la valeur.
#
# Champs :
#   stat : clé interne de la statistique
#   sign : +1 bonus, -1 malus (la valeur brute est toujours positive dans le JSON)
#   kind : flat (défaut) | random_elements | charac_param | state | ignore
#   fr   : libellé, pour les rapports
#   todo : hypothèse non vérifiée

actions:
  # --- Points et caractéristiques de base -------------------------------
  20:   {stat: hp,               sign: 1,  fr: "PV"}
  21:   {stat: hp,               sign: -1, fr: "PV (malus)"}
  31:   {stat: ap,               sign: 1,  fr: "PA"}
  56:   {stat: ap,               sign: -1, fr: "PA max (malus)"}
  41:   {stat: mp,               sign: 1,  fr: "PM"}
  57:   {stat: mp,               sign: -1, fr: "PM max (malus)"}
  191:  {stat: wp,               sign: 1,  fr: "PW"}
  192:  {stat: wp,               sign: -1, fr: "PW max (malus)"}
  160:  {stat: range,            sign: 1,  fr: "Portée"}
  161:  {stat: range,            sign: -1, fr: "Portée (malus)"}
  150:  {stat: crit_rate,        sign: 1,  fr: "% Coup critique"}
  168:  {stat: crit_rate,        sign: -1, fr: "% Coup critique (malus)"}
  875:  {stat: block,            sign: 1,  fr: "% Parade"}
  876:  {stat: block,            sign: -1, fr: "% Parade (malus)"}
  171:  {stat: initiative,       sign: 1,  fr: "Initiative"}
  172:  {stat: initiative,       sign: -1, fr: "Initiative (malus)"}
  173:  {stat: lock,             sign: 1,  fr: "Tacle"}
