# Sublimations : description et effets des ÉTATS appliqués (clé = id d'état).
# Fichier généré par tools/build_sublimations_yaml.py à partir de WakForge (MIT) :
# descriptions FR par niveau et niveaux de cumul max (limit).
# Les couleurs, niveaux et raretés des sublimations viennent de items.json (CDN).
# 'effects' = effets pris en compte par le solveur (choisis à la main) :
#   stat, values (par niveau d'état 1..N), mode (flat | pct_level = % du niveau),
#   condition (none, melee, distance, berserk, hp_high, no_armor, two_handed,
#   light_weapons, element:<élément>, no_secondary = maîtrises secondaires <= 0).
#   stat_le:<stat>:<v> / stat_ge:<stat>:<v> = la stat totale doit être <= / >= v (épiques « au lancement du
#   combat »). no_secondary et stat_* : le solveur impose la condition quand il place la sublimation.
#   « a&b » = les deux conditions. stat crit_to_elem = Dénouement (Maîtrise Critique convertie en Élémentaire).
# 'confirmed: true' = description, niveaux et effets vérifiés à la main (les autres sont grisées dans l'interface ;
#   option « seulement les sublimations confirmées »).
# Après un patch : ajouter ici les nouveaux états (sinon : affichés, mais non optimisés).
# Valeurs par niveau vérifiées sur l'encyclopédie Ankama et en jeu (voir OFFICIAL_LEVELS dans
# tools/build_sublimations_yaml.py) : l'encyclopédie et WakForge se trompent sur le dernier niveau.
