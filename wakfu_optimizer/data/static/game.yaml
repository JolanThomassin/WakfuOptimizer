# Données de jeu maintenues à la main (absentes du CDN).

# Tranches de niveau (vérifiées : les niveaux d'items se concentrent sur ces bornes).
brackets:
  - [1, 20]
  - [21, 35]
  - [36, 50]
  - [51, 65]
  - [66, 80]
  - [81, 95]
  - [96, 110]
  - [111, 125]
  - [126, 140]
  - [141, 155]
  - [156, 170]
  - [171, 185]
  - [186, 200]
  - [201, 215]
  - [216, 230]
  - [231, 245]

# Statistiques de base du personnage (source : WakForge, formules vérifiées en jeu par son auteur).
base:
  ap: 6
  mp: 3
  wp: 6          # 12 pour le Xélor (voir classes)
  crit_rate: 3
  hp_flat: 50    # + 10 par niveau
  hp_per_level: 10

# Plafonds
caps:
  res_pct: 90     # % de résistance
  crit_rate: 100
  block: 100
  wp: 20

# Points de caractéristiques : nombre de points = floor((niveau + offset) / 4)
# (Majeur : min(floor((niveau + 25) / 50), 4)).
# Chaque entrée : stat -> valeur par point, max = points max dans cette ligne.
characteristics:
  intelligence:
    offset: 2
    lines:
      hp_pct:   {per_point: {hp_pct: 4}, max: null}
      elem_res: {per_point: {elem_res: 10}, max: 10}
      barrier:  {per_point: {barrier: 1}, max: 10}
      heals_received_pct: {per_point: {heals_received_pct: 6}, max: 5}
      armor_hp_pct: {per_point: {armor_hp_pct: 4}, max: 10}
  strength:
    offset: 1
    lines:
      elem_mastery:     {per_point: {elem_mastery: 5}, max: null}
      melee_mastery:    {per_point: {melee_mastery: 8}, max: 40}
      distance_mastery: {per_point: {distance_mastery: 8}, max: 40}
      hp:               {per_point: {hp: 20}, max: null}
  agility:
    offset: 0
    lines:
      lock:  {per_point: {lock: 6}, max: null}
      dodge: {per_point: {dodge: 6}, max: null}
      initiative: {per_point: {initiative: 4}, max: 20}
      lock_dodge: {per_point: {lock: 4, dodge: 4}, max: null}
      willpower: {per_point: {willpower: 1}, max: 20}
  fortune:
    offset: -1
    lines:
      crit_rate:     {per_point: {crit_rate: 1}, max: 20}
      block:         {per_point: {block: 1}, max: 20}
      crit_mastery:  {per_point: {crit_mastery: 4}, max: null}
      rear_mastery:  {per_point: {rear_mastery: 6}, max: null}
      berserk_mastery: {per_point: {berserk_mastery: 8}, max: null}
      heal_mastery:  {per_point: {heal_mastery: 6}, max: null}
      rear_res:      {per_point: {rear_res: 4}, max: 20}
      crit_res:      {per_point: {crit_res: 4}, max: 20}
  major:
    lines:
      ap:        {per_point: {ap: 1}, max: 1}
      mp:        {per_point: {mp: 1, elem_mastery: 20}, max: 1}
      range:     {per_point: {range: 1, elem_mastery: 40}, max: 1}
      wp:        {per_point: {wp: 2}, max: 1}
      armor_given_pct: {per_point: {armor_given_pct: 10}, max: 1}
      dmg_pct:   {per_point: {dmg_pct: 10}, max: 1}
      elem_res:  {per_point: {elem_res: 50}, max: 1}
      heal_pct:  {per_point: {heal_pct: 10}, max: 1}
      indirect_pct: {per_point: {indirect_pct: 10}, max: 1}

# Classes : éléments préremplis et priorités par défaut (tout est modifiable dans l'interface).
# range : melee | distance | mixed (frappe aussi bien au contact qu'à distance : les deux maîtrises comptent à moitié).
# Les éléments sont une valeur de départ : à corriger ici si la classe a évolué.
classes:
  # passive : passif inné de la classe (toujours actif). effects = stats comptées par l'optimiseur
  #   (mode flat = valeur fixe, pct_level = % du niveau). Les passifs à équiper ne sont pas pris en compte.
  #   Source : pages de classe de wakfu.wiki.gg.
  # range : melee | distance | mixed (les deux à moitié) | best (la meilleure des deux compte, ex. Roublard)
  # archetypes : archétypes habituellement joués (engine/archetypes.py), le plus courant en premier. Ils sont proposés
  #   en tête de liste dans l'interface ; le premier est l'archétype par défaut de la classe.
  feca:
    {fr: Féca, elements: [fire, water, earth], range: distance, role: tank, archetypes: [tank, support_buff, dps_distance],
     passive: {name: Protecteur, desc: "Débloque Armure de paix ; régénère ses PW grâce à Paix intérieure."}}
  osamodas:
    {fr: Osamodas, elements: [fire, earth, air], range: distance, role: dps, archetypes: [dps_distance, support_buff],
     passive: {name: Invocateur animal, desc: "Débloque ses invocations, la Forme draconique et le Gobgob ; partage ses PW avec ses invocations ; +1 PW en fin de tour."}}
  enutrof:
    {fr: Enutrof, elements: [fire, water, earth], range: distance, role: dps, archetypes: [dps_distance, support_debuff],
     passive: {name: Chasseur de trésors, desc: "Invoque la Foreuse en début de combat, déterre 4 mines par tour ; +1 PW en fin de tour."}}
  sram:
    {fr: Sram, elements: [fire, water, air], range: melee, role: dps, archetypes: [dps_rear, dps_melee], rear: true,
     passive: {name: Assassin squelettique, desc: "+20 % Coup critique en début de combat ; +50 % de dommages sur les ennemis isolés ; gagne du Point faible.",
               effects: [{stat: crit_rate, value: 20}]}}
  xelor:
    {fr: Xélor, elements: [fire, water, air], range: distance, role: dps, archetypes: [dps_distance, support_debuff],
     passive: {name: Mage du temps, desc: "+6 PW (12 au lieu de 6) ; regagne 1 PW (+1 par PA non utilisé) en fin de tour ; Cadran, Vol du temps, Distorsion.",
               effects: [{stat: wp, value: 6}]}}
  ecaflip:
    {fr: Ecaflip, elements: [fire, water, earth], range: melee, role: dps, archetypes: [dps_melee, tank],
     passive: {name: Guerrier joueur, desc: "+20 % Coup critique en début de combat ; les critiques au-delà de 100 % augmentent les dommages ; +1 PW en fin de tour.",
               effects: [{stat: crit_rate, value: 20}]}}
  eniripsa:
    {fr: Eniripsa, elements: [fire, water, air], range: distance, role: heal, archetypes: [heal, dps_distance],
     passive: {name: Soigneur, desc: "Bonus de PV pour toute l'équipe : 200 % du niveau ; +1 PW en fin de tour (+2 si PV >= 80 %).",
               effects: [{stat: hp, value: 200, mode: pct_level}]}}
  iop:
    {fr: Iop, elements: [fire, earth, air], range: melee, role: dps, archetypes: [dps_melee, tank],
     passive: {name: Guerrier, desc: "+1 PM ; Puissance en début de combat ; combos de sorts et Concentration.",
               effects: [{stat: mp, value: 1}]}}
  cra:
    {fr: Crâ, elements: [fire, earth, air], range: distance, role: dps, archetypes: [dps_distance],
     passive: {name: Archer, desc: "+1 Portée ; Affûtage et Précision en lançant des sorts ; état Évasif loin des ennemis ; balises.",
               effects: [{stat: range, value: 1}]}}
  sadida:
    {fr: Sadida, elements: [water, earth, air], range: distance, role: dps, archetypes: [dps_distance, heal, support_debuff],
     passive: {name: Invocateur végétal, desc: "Graine, Ultra-Puissante, Poupée vaudou ; +1 PW en fin de tour (+1 par Arbre)."}}
  sacrier:
    {fr: Sacrieur, elements: [fire, earth, air], range: melee, role: tank, archetypes: [tank, berserk], berserk: true,
     passive: {name: Berserker, desc: "+400 % du niveau en PV ; chaque % de PV perdu donne de la Furie (PA, PM, PW, Châtiment).",
               effects: [{stat: hp, value: 400, mode: pct_level}]}}
  pandawa:
    {fr: Pandawa, elements: [fire, water, earth], range: melee, role: tank, archetypes: [tank, dps_melee],
     passive: {name: Savoir-faire pandawa, desc: "Tonneau, Karcham, Chamrak ; +2 PW en fin de tour (1 si Gai) ; soins en portant son tonneau."}}
  rogue:
    {fr: Roublard, elements: [fire, earth, air], range: best, role: dps, archetypes: [dps_distance, dps_melee],
     passive: {name: Maître de la diversion, desc: "Passe en mode Sournois au contact et Fuyard à distance : sa meilleure maîtrise (mêlée ou distance) compte. Bombes ; +1 PW en fin de tour."}}
  masqueraider:
    {fr: Zobal, elements: [fire, water, air], range: melee, role: support, archetypes: [support_buff, support_heal, tank, dps_melee],
     passive: {name: Soldat lunatique, desc: "Masques Psychopathe, Lâche et Classique ; +3 PW en fin de tour sans masque ; collisions sans perte de PA."}}
  ouginak:
    {fr: Ouginak, elements: [water, earth, air], range: melee, role: dps, archetypes: [dps_melee, tank],
     passive: {name: Ouginak, desc: "Jauge de Rage (forme Ouginak), Proie ; ses poisons utilisent sa meilleure maîtrise (mêlée ou distance)."}}
  foggernaut:
    {fr: Steamer, elements: [fire, water, earth], range: distance, role: dps, archetypes: [dps_distance, support_buff],
     passive: {name: Maître du sabotage, desc: "La moitié des PW devient des Points de Stasis ; Microbot, Tourelle, Steamergeur, Canonnier."}}
  eliotrope:
    {fr: Eliotrope, elements: [water, earth, air], range: mixed, role: dps, archetypes: [dps_mixed, heal],
     passive: {name: Guerrier mobile, desc: "Convertit 2 Portée en 1 PM en début de combat (max 1) ; portails ; débute sous Calme.",
               effects: [{stat: mp, value: 1}, {stat: range, value: -2}]}}
  huppermage:
    {fr: Huppermage, elements: [fire, water, earth, air], range: mixed, role: dps, archetypes: [dps_mixed, dps_distance],
     passive: {name: Guerrier élémentaire, desc: "Runes élémentaires (+1 PA par rune générée) ; PW convertis en Brise quadramentale (75 par PW)."}}
