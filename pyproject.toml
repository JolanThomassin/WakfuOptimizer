[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wakfu-optimizer"
version = "0.1.0"
description = "Optimiseur de build Wakfu (équipement, châsses, sublimations) basé sur OR-Tools CP-SAT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "ortools>=9.10",     # étape 3+
    "PySide6>=6.7",      # étape 5
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "types-PyYAML", "highspy>=1.11"]   # highspy : solveur de la version navigateur

[tool.setuptools.packages.find]
include = ["wakfu_optimizer*"]
exclude = ["tests*", "tools*"]

[tool.setuptools.package-data]
"wakfu_optimizer.data" = ["static/*.yaml"]
"wakfu_optimizer.gui" = ["assets/*/*.png"]
"wakfu_optimizer.web" = ["static/*", "static/js/*"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
